amp:
  # AMP panel URL — either the ADS panel URL (e.g. http://192.168.1.x:8080)
  # or the direct instance URL if you know the port.
  url: "http://192.168.1.x:8080"
  username: "admin"
  password: "changeme"
  # Instance ID of the Minecraft server within ADS. Use the dashboard's
  # AMP Connection section to load available instances and pick the right one.
  # Leave empty if amp.url points directly at the instance (not the ADS panel).
  instance_id: ""

service:
  host: "0.0.0.0"
  port: 8765
  # How long (in seconds) a viewer stays whitelisted. Default: 7200 = 2 hours.
  whitelist_duration_seconds: 7200
  # How often the background thread checks for expired entries (seconds).
  expiry_check_interval_seconds: 60
  # Optional: set a secret token so only Streamer.Bot can call the endpoint.
  # Leave empty to disable auth (fine if your VM firewall restricts the port to LAN only).
  # Streamer.Bot must send header: Authorization: Bearer <token>
  secret_token: ""

twitch:
  # Register a Twitch app at https://dev.twitch.tv/console/apps
  # Set the OAuth Redirect URL to: http://<your-unraid-ip>:8765/twitch/callback
  client_id: ""
  client_secret: ""
  channel_name: ""   # Your Twitch username (lowercase)
  # Connect one or more channel point rewards, each with its own Minecraft gamemode
  # (survival/creative/adventure/spectator) applied once the redeemer joins the server.
  # Managed via the dashboard's Settings -> Twitch Integration -> Channel Point Rewards
  # section. Leave empty to whitelist on any redemption (no gamemode change).
  rewards: []
  # Example:
  # rewards:
  #   - reward_id: "abc123"
  #     title: "Whitelist Me - Survival"
  #     gamemode: survival

  # Set automatically by the dashboard OAuth flow — do not edit manually
  access_token: ""
  refresh_token: ""
  broadcaster_id: ""

database:
  path: "/config/whitelist.db"

logging:
  level: "INFO"
  # Set to empty string to log to stdout/journal only (recommended for systemd).
  file: ""
